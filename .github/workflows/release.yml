name: Release

# Publishes a GitHub release when a `v*` tag is pushed; see "Releasing" in
# README.md. Every action is pinned to a full commit ID because the publish
# job can write releases and sign attestations. Only that job gets write
# permissions; nothing it publishes is built with a cache.

on:
  push:
    tags: ["v*"]

permissions: {}

# Must differ from CI's group, which becomes "Release-<ref>" when called from
# here, or the two would wait on each other.
concurrency:
  group: release-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.ref_name }}

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # all of main, to check the tagged commit is on it
          persist-credentials: false

      - name: Read the release version
        id: version
        shell: python3 {0}
        run: |
          import os, pathlib, sys, tomllib

          workspace = tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]
          version = workspace["package"]["version"]

          errors = []
          for name in ("fkospa", "fwknop"):
              pin = workspace["dependencies"][name].get("version")
              if pin != version:
                  errors.append(
                      f"Cargo.toml: [workspace.dependencies] {name} has version {pin!r}, "
                      f"but the release version is {version!r}"
                  )
          for manifest in sorted(pathlib.Path("crates").glob("*/Cargo.toml")):
              package = tomllib.loads(manifest.read_text())["package"]
              if package.get("version") != {"workspace": True}:
                  errors.append(f"{manifest}: set version.workspace = true")
          for error in errors:
              print(f"::error::{error}")
          if errors:
              sys.exit(1)

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              print(f"version={version}", file=out)
              # A version with a hyphen, like 0.2.0-rc.1, is a pre-release.
              print(f"prerelease={'true' if '-' in version else 'false'}", file=out)

      - name: Check the tag, its commit and existing releases
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match the release version $VERSION in Cargo.toml (expected v$VERSION)."
            exit 1
          fi

          commit=$(git rev-parse "$TAG^{commit}")
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::Tag $TAG points at $commit, which is not on main."
            exit 1
          fi

          # Published releases are never changed: a bad one is fixed by
          # releasing the next version.
          if out=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" 2>&1); then
            echo "::error::A release for $TAG already exists. Release the next version instead."
            exit 1
          elif ! grep -q 'HTTP 404' <<<"$out"; then
            echo "::error::Could not check for an existing release: $out"
            exit 1
          fi

  ci:
    name: CI
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    name: Build (${{ matrix.target }})
    needs: [preflight, ci]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # musl-gcc compiles ring's C code for the static musl build.
      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"

      - name: Install Rust
        run: |
          rustup toolchain install
          rustup target add "$TARGET"

      - name: Test
        run: cargo test --workspace --locked --target "$TARGET"

      - name: Build
        run: cargo build --release --locked --target "$TARGET" -p fwknop-cli -p fwknopd -p fwknop-convert

      - name: Check the binaries
        run: |
          set -euo pipefail
          for prog in fwknop fwknopd fwknop-convert; do
            bin="target/$TARGET/release/$prog"
            out=$("$bin" --version)
            echo "$out"
            case "$out" in
              *" version $VERSION (commit: "*) ;;
              *) echo "::error::$prog --version does not report release version $VERSION and a commit."; exit 1 ;;
            esac
            case "$out" in
              *dirty*) echo "::error::$prog was built from a work tree with changes."; exit 1 ;;
            esac
            if readelf --program-headers "$bin" | grep -q INTERP || readelf --dynamic "$bin" | grep -q NEEDED; then
              echo "::error::$prog is not statically linked."
              exit 1
            fi
          done

      - name: Package
        run: |
          set -euo pipefail
          name="fwknop-rs-$VERSION-$TARGET"
          stage="target/dist/$name"
          rm -rf target/dist
          mkdir -p "$stage/examples"

          install -m 0755 target/"$TARGET"/release/{fwknop,fwknopd,fwknop-convert} "$stage/"
          install -m 0644 LICENSE README.md "$stage/"
          cp -R conf_files systemd "$stage/"
          cp -R examples/configs "$stage/examples/"
          find "$stage" -type d -exec chmod 0755 {} +
          find "$stage" -type f ! -perm -u+x -exec chmod 0644 {} +
          chmod 0600 "$stage/conf_files/access.yaml" # holds keys once filled in

          # Same input, same tarball: fixed order, owner and timestamps.
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="@$(git log -1 --format=%ct)" \
            -C target/dist -cf - "$name" | gzip -9n > "target/dist/$name.tar.gz"
          tar -tvzf "target/dist/$name.tar.gz"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: target/dist/fwknop-rs-${{ env.VERSION }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release
      id-token: write # sign the attestations
      attestations: write # store the attestations
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # earlier tags and commits, for the release notes
          persist-credentials: false

      # Make sure the local tag is the annotated tag object, with its message.
      - name: Fetch the tag
        run: git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          ls -l
          count=$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)
          if [ "$count" -ne 2 ]; then
            echo "::error::Expected 2 tarballs, found $count."
            exit 1
          fi
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Release notes
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"

          # A final release lists the changes since the previous final release;
          # a pre-release, since the previous tag of any kind.
          exclude=()
          if [ "$PRERELEASE" = false ]; then exclude=(--exclude 'v*-*'); fi
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${exclude[@]}" "$TAG^" 2>/dev/null || true)

          {
            # An annotated tag's message goes first (without any signature).
            if [ "$(git cat-file -t "refs/tags/$TAG")" = tag ]; then
              git for-each-ref --format='%(contents:subject)%0a%0a%(contents:body)' "refs/tags/$TAG"
              echo
            fi
            echo "## Commits"
            echo
            if [ -n "$prev" ]; then
              git log --no-merges --format='- %s (%h)' "$prev..$TAG"
              echo
              echo "**Full changelog**: $url/compare/$prev...$TAG"
            else
              git log --no-merges --format='- %s (%h)' "$TAG"
              echo
              echo "**Full history**: $url/commits/$TAG"
            fi
          } > "$notes"
          cat "$notes"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "fwknop-rs $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${flags[@]}"
