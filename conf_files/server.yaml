# Sample fwknopd server configuration file.
#
udp_port: 62201
bind_address: "127.0.0.1"
log_file: ""
syslog_identity: "fwknopd"
verbose: true
pid_file: /tmp/fwknopd-test.pid
max_spa_packet_age: 120

# Actions are the commands fwknopd runs to open and close access. The
# simplest way to get them is an action template, looked up in action_dir:
#
#   action_template: nftables.yaml
#   action_dir: /etc/fwknop/actions   # the default
#
# Available templates: nftables.yaml (recommended), iptables.yaml and
# firewalld.yaml. You can also give an absolute path to your own template.
#
# The nftables template adds its rules to a fwknop_input chain in your
# "inet filter" table, jumped to from that table's "input" chain (the names in
# Debian's and Ubuntu's stock /etc/nftables.conf). The iptables template does
# the same with an FWKNOP_INPUT chain jumped to from INPUT (IPv4 only).
#
# Alternatively, define actions inline; they override the template's one at a
# time. With nftables (IPv4 allow IPs only; the template also handles IPv6):
#
# actions:
#   validate: "nft list chain inet filter input > /dev/null"
#   init: "nft add chain inet filter fwknop_input && nft insert rule inet filter input jump fwknop_input"
#   open: "nft add rule inet filter fwknop_input ip saddr {{.SourceIP}} {{.Proto}} dport {{.Port}} accept comment '\"fwknop-{{.SourceIP}}-{{.Proto}}-{{.Port}}\"'"
#   close: "nft -a list chain inet filter fwknop_input | grep -F 'fwknop-{{.SourceIP}}-{{.Proto}}-{{.Port}}' | awk '{print $NF}' | xargs -r -I{} nft delete rule inet filter fwknop_input handle {}"
#   shutdown: "nft -a list chain inet filter input | awk '/jump fwknop_input/ {print $NF}' | xargs -r -I{} nft delete rule inet filter input handle {}; nft flush chain inet filter fwknop_input; nft delete chain inet filter fwknop_input"
#
# Or with iptables:
#
# actions:
#   validate: "which iptables"
#   init: "iptables -N FWKNOP_INPUT 2>/dev/null; iptables -C INPUT -j FWKNOP_INPUT 2>/dev/null || iptables -I INPUT -j FWKNOP_INPUT"
#   check: "iptables -C FWKNOP_INPUT -s {{.SourceIP}} -p {{.Proto}} --dport {{.Port}} -j ACCEPT 2>/dev/null"
#   open: "iptables -A FWKNOP_INPUT -s {{.SourceIP}} -p {{.Proto}} --dport {{.Port}} -j ACCEPT"
#   close: "iptables -D FWKNOP_INPUT -s {{.SourceIP}} -p {{.Proto}} --dport {{.Port}} -j ACCEPT"
#   shutdown: "iptables -F FWKNOP_INPUT; iptables -D INPUT -j FWKNOP_INPUT; iptables -X FWKNOP_INPUT"
#
# Placeholders: {{.SourceIP}}, {{.Proto}}, {{.Port}}, {{.Username}},
#   {{.Timestamp}}, {{.Timeout}}, {{.AccessMsg}}, {{.NATAccess}}
